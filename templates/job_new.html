{% extends 'base.html' %}{% block content %}<div class="hero"><div><h1>Start a New Job</h1><p>Create the customer, property, work description, pricing, agreement and follow-up record.</p></div></div>
<form method="post" class="panel form-grid"><h2>Customer</h2><label>Customer name<input name="customer_name" required></label><label>Phone<input name="phone"></label><label>Email<input type="email" name="email"></label><h2 class="full">Property</h2><label class="full">Street address<input name="property_address" required></label><label>City<input name="city"></label><label>State<input name="state" value="CO"></label><label>ZIP<input name="zip"></label><h2 class="full">Job</h2><label>Service date<input type="date" name="scheduled_date"></label><label>Job type<select name="job_type"><option>Ordinary Plumbing</option><option>Independent Assessment</option></select></label><label>Issue type<input name="issue_type" placeholder="Water heater, toilet, water main assessment..."></label><label>Urgency<select name="urgency"><option>Routine</option><option>Time-sensitive</option><option>Active backup / leak</option></select></label><label class="full">Customer's description<textarea name="customer_concern" rows="4"></textarea></label><label class="full">Services requested / work description<textarea name="service_description" rows="4" placeholder="Describe what the customer wants us to inspect, repair, replace or assess."></textarea></label><label class="full">Prior recommendation / estimate (if any)<textarea name="prior_recommendation" rows="3"></textarea></label><div class="full actions"><button>Create Job & Build Price</button></div></form>{% endblock %}
