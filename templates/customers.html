{% extends 'base.html' %}{% block content %}<div class="hero"><div><h1>Customers</h1><p>Customer history, jobs and follow-up records.</p></div><a class="btn" href="/jobs/new">+ New Job</a></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Email</th><th>Jobs</th><th>Last Job</th><th></th></tr></thead><tbody>{% for c in customers %}<tr><td><b>{{c.name}}</b></td><td>{{c.phone}}</td><td>{{c.email}}</td><td>{{c.job_count}}</td><td>{{c.last_job[:10] if c.last_job else '—'}}</td><td><a href="/customers/{{c.id}}">Open</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
