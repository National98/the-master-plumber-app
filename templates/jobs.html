{% extends 'base.html' %}{% block content %}<div class="hero"><div><h1>Jobs</h1><p>Search customer, property, or job number.</p></div><a class="btn" href="/jobs/new">+ New Job</a></div>
<div class="panel"><form class="search"><input name="q" value="{{q}}" placeholder="Search jobs"><button>Search</button></form><div class="table-wrap"><table><thead><tr><th>Job</th><th>Customer</th><th>Property</th><th>Issue</th><th>Status</th><th></th></tr></thead><tbody>{% for j in jobs %}<tr><td>{{j.job_number}}</td><td>{{j.customer_name}}</td><td>{{j.address}}</td><td>{{j.issue_type}}</td><td>{{j.status}}</td><td><a href="/jobs/{{j.id}}">Open</a></td></tr>{% else %}<tr><td colspan="6">No matching jobs.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
