{% extends 'base.html' %}{% block content %}<div class="hero"><div><h1>Pricing Catalog</h1><p>Defaults speed up invoicing. Any job can still use a custom price.</p></div></div><div class="grid-2"><div class="panel"><h2>Current Pricing</h2>{% for p in pricing %}<form method="post" action="/pricing/{{p.id}}/update" class="price-card"><div><b>{{p.code}}</b><input name="name" value="{{p.name}}"><textarea name="description" rows="2">{{p.description}}</textarea></div><div><label>Default price<input type="number" step="0.01" name="default_price" value="{{p.default_price}}"></label><label class="inline"><input type="checkbox" name="active" {{'checked' if p.active else ''}}>Active</label><button>Save</button></div></form>{% endfor %}</div><form method="post" action="/pricing/add" class="panel"><h2>Add Service</h2><label>Code<input name="code" required></label><label>Name<input name="name" required></label><label>Description<textarea name="description"></textarea></label><label>Default price<input type="number" step="0.01" name="default_price" required></label><button>Add Pricing Item</button></form></div>{% endblock %}
